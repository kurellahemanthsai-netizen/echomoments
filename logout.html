<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EchoMoments</title>
    <link rel="shortcut icon" href="images/logo.png" type="image/x-icon" />
    <link rel="stylesheet" href="logout.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
</head>
<body>
    <div class="logout-container">

    <div class="logout-card">

        <div class="top-buttons">
            <button class="theme-btn"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-moon-fill" viewBox="0 0 16 16">
  <path d="M6 .278a.77.77 0 0 1 .08.858 7.2 7.2 0 0 0-.878 3.46c0 4.021 3.278 7.277 7.318 7.277q.792-.001 1.533-.16a.79.79 0 0 1 .81.316.73.73 0 0 1-.031.893A8.35 8.35 0 0 1 8.344 16C3.734 16 0 12.286 0 7.71 0 4.266 2.114 1.312 5.124.06A.75.75 0 0 1 6 .278"/>
</svg></button>
            <button class="rtl-btn">RTL</button>
        </div>

        <h1 class="logo" onclick="document.location='index.html'">
            Echo<span>Moments</span>
        </h1>

        <img src="images/admin.avif" alt="Profile" class="profile">

        <h2>Ready to Leave?</h2>

        <p>
            You are about to sign out from your EchoMoments dashboard.
            Any unsaved changes may be lost.
        </p>

        <div class="actions">

            <a href="login.html" class="logout-btn">
                Logout
            </a>

            <a href="dashboard.html" class="cancel-btn">
                Cancel
            </a>

        </div>

        <div class="footer-text">
            Thank you for managing memories with EchoMoments 
        </div>

    </div>

</div>
<script src="logout.js"></script>
</body>
</html>
